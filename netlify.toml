headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[functions]

  [functions."*"]

[build]
publish = "A:\\"
publishOrigin = "config"
command = "npm run build:static"
commandOrigin = "config"
ignore = "/bin/false"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/*.jsx"

  [headers.values]
  Content-Type = "application/javascript; charset=utf-8"
  Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
for = "/build/*"

  [headers.values]
  Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
for = "/cart-store.js"

  [headers.values]
  Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
for = "/uploads/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/index.html"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/cart.html"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/checkout.html"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/404.html"

  [headers.values]
  Cache-Control = "public, max-age=3600"

[[headers]]
for = "/favicon.ico"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Content-Security-Policy = "default-src 'self' https: data: blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://*.shopify.com https://*.myshopify.com https://formsubmit.co https://www.facebook.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:; worker-src 'self' blob:; upgrade-insecure-requests"

[[headers]]
for = "/manifest.webmanifest"

  [headers.values]
  Content-Type = "application/manifest+json; charset=utf-8"
  Cache-Control = "public, max-age=86400, must-revalidate"

